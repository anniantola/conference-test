name: Validate and deploy Conference Companion

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check out shared attendee engine
        uses: actions/checkout@v6
        with:
          repository: anniantola/conference-companion
          ref: dd93412563685076cacaf2d9f1616b99ca373bd3
          path: .engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate conference package
        run: npm test
      - name: Stage public application files
        run: npm run stage
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
